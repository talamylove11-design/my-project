<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Creative Space</title>
    <style>
        /* ستايل بسيط يجمع بين Pinterest وتطبيقات المونتاج */
        body {
            background-color: #121212; /* لون داكن مثل CapCut */
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .bilingual-text {
            margin-bottom: 20px;
        }

        .en { font-size: 24px; font-weight: bold; display: block; }
        .ar { font-size: 18px; color: #aaaaaa; display: block; margin-top: 5px; }

        /* حاوية الصور والفيديوهات بأسلوب Pinterest */
        .gallery {
            column-count: 2; /* تقسيم الصفحة لعمودين */
            column-gap: 15px;
            width: 100%;
            max-width: 800px;
        }

        .card {
            background: #1e1e1e;
            border-radius: 12px;
            margin-bottom: 15px;
            padding: 10px;
            break-inside: avoid;
            border: 1px solid #333;
        }

        .card img, .card video {
            width: 100%;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="header">
        <span class="en">My Creative Portfolio</span>
        <span class="ar">معرض أعمالي الإبداعية</span>
    </div>

    <div class="gallery">
        <div class="card">
            <span class="en">Video Edit #1</span>
            <span class="ar">مونتاج فيديو رقم ١</span>
            <p style="font-size: 12px; color: #777;">Made with CapCut & NodeVideo</p>
        </div>

        <div class="card">
            <span class="en">Aesthetic Design</span>
            <span class="ar">تصميم جمالي</span>
        </div>
    </div>

</body>
</html>
